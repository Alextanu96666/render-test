name: Deploy Test for my application

on:
  push:
    branches: [main, dev]
  pull_request:          # pull requests kör bara testerna, de driftsätter aldrig
    branches: [main, dev]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Build project
        run: npm run build
      - name: Testecho
        run: echo "This is a test"
